<style>
  :root { --ink:#1B2430; --soft:#5A6675; --line:#E4E9F0; --accent:#B85C38;
           --primary:#2F5D8A; --bg:#F7F9FC; --lock:#B8912F; --lockbg:#FFFCF0; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 28px 40px; background:#fff; color:var(--ink);
         font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif; }
  h1 { font-size:19px; margin:0 0 4px; letter-spacing:.2px; }
  .sub { font-size:12.5px; color:var(--soft); margin:0 0 16px; }
  .wrap { position:relative; width:100%; max-width:1780px; }
  .stage { position:relative; width:100%; }
  .stage img { width:100%; height:auto; display:block; cursor:crosshair;
                user-select:none; -webkit-user-drag:none; }
  .stage canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .panel { margin-top:10px; border:1px solid var(--line); border-radius:8px;
            background:var(--bg); padding:12px 14px; min-height:86px; transition:background .15s; }
  .panel.locked { border-color:#E3D3A0; background:var(--lockbg); }
  .panel .hint { color:var(--soft); font-size:13px; }
  .head { display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12.5px;
           color:var(--soft); }
  .badge { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px;
            background:#F3E7C8; color:#7A5E12; }
  .badge.off { background:#E8EEF4; color:#41505F; }
  .row { display:grid; grid-template-columns:120px 132px 138px 1fr; gap:10px;
           padding:7px 0; border-top:1px dashed var(--line); font-size:13px; align-items:start; }
  .row:first-of-type { border-top:none; }
  .row.hi .alloy { color:var(--accent); }
  .alloy { font-weight:600; }
  .val { font-variant-numeric:tabular-nums; line-height:1.5; }
  .line2 { display:block; margin-top:2px; color:#41505F; font-size:12.5px; }
  .val b { font-weight:600; }
  .src { color:var(--soft); font-size:12.5px; line-height:1.55; }
  .src i { font-style:normal; color:#8A94A3; }
  .tag { display:inline-block; font-size:11.5px; padding:1px 6px; border-radius:9px;
          background:#E8EEF4; color:var(--primary); margin-left:6px; }
  .legend { font-size:12px; color:var(--soft); margin-top:8px; }
  .legend span.dot { display:inline-block; width:9px; height:9px; border-radius:50%;
                  margin-right:5px; vertical-align:-1px; }
  .key { border:1px solid var(--line); border-radius:5px; padding:0 6px; font-size:11.5px;
          background:#fff; color:#41505F; }
</style>

const img = document.getElementById('chart');
const ov  = document.getElementById('ov');
const ctx = ov.getContext('2d');
const panel = document.getElementById('panel');
const RADIUS = 9;

let locked = false;
let lockedHits = [];
let lockedAt = null;
let hoverPos = null;

function toImg(evt) {
  const r = img.getBoundingClientRect();
  return { x: (evt.clientX - r.left) * (1780 / r.width),
            y: (evt.clientY - r.top)  * (1000 / r.height) };
}

function hitTest(q) {
  const out = [];
  for (const p of PTS) {
    const dx = p.x - q.x, dy = p.y - q.y;
    if (dx * dx + dy * dy <= RADIUS * RADIUS) out.push(p);
  }
  out.sort((a, b) => (b.t - a.t) || (a.a < b.a ? -1 : 1));
  return out;
}

function fmt(v, unit) {
  return (v === null || v === undefined) ? '<i>—</i>' : `<b>${v}</b> ${unit}`;
}

function drawHits(hits, isLocked) {
  ctx.clearRect(0, 0, 1780, 1000);
  if (!hits.length) return;
  for (const h of hits) {
    ctx.beginPath();
    ctx.arc(h.x, h.y, isLocked ? 13 : 11, 0, Math.PI * 2);
    if (isLocked) {
      ctx.strokeStyle = '#B8912F';
      ctx.lineWidth = 3;
    } else {
      ctx.strokeStyle = h.hi ? '#C0392B' : '#2F5D8A';
      ctx.lineWidth = 2.2;
    }
    ctx.stroke();
  }
  if (isLocked && lockedAt) {
    ctx.beginPath();
    ctx.moveTo(lockedAt.x - 6, lockedAt.y); ctx.lineTo(lockedAt.x + 6, lockedAt.y);
    ctx.moveTo(lockedAt.x, lockedAt.y - 6); ctx.lineTo(lockedAt.x, lockedAt.y + 6);
    ctx.strokeStyle = '#B8912F'; ctx.lineWidth = 1.4; ctx.stroke();
  }
}

function renderPanel(hits, isLocked) {
  if (!hits.length) {
    panel.classList.remove('locked');
    panel.innerHTML = '<div class="hint">把光标移到图上任意一个点。</div>';
    return;
  }
  panel.classList.toggle('locked', isLocked);
  const badge = isLocked
      ? '<span class="badge">🔒 已锁定　右键或 Esc 解锁</span>'
      : '<span class="badge off">悬停预览</span>';
  const pos = (hits.length === 1)
      ? `${hits[0].t} °C / UTS ${hits[0].u} MPa`
      : `${hits.length} 条记录`;
  let out = `<div class="head">${badge}<span>命中 ${hits.length} 条：${pos}</span></div>`;
  for (const h of hits) {
    const extra = [];
    if (h.y2 !== null) extra.push(`YS ${h.y2} MPa`);
    if (h.el !== null) extra.push(`EL ${h.el}%`);
    const sub = extra.map(t => `<span class="line2">${t}</span>`).join('');
    out += `<div class="row ${h.hi ? 'hi' : ''}">`
         + `<div class="alloy">${h.a}</div>`
         + `<div class="val">${fmt(h.t, '°C')}</div>`
         + `<div class="val">UTS ${fmt(h.u, 'MPa')}${sub}</div>`
         + `<div class="src">`
         + `<b>${h.s}</b>　<span class="tag">${h.st}</span><br>`
         + (h.n && h.n !== h.a ? `<i>文献名</i> ${h.n}` : '')
         + `</div></div>`;
  }
  panel.innerHTML = out;
}

/* 悬停：锁定时冻结，不刷新 */
img.addEventListener('mousemove', (evt) => {
  if (locked) return;
  hoverPos = toImg(evt);
  const hits = hitTest(hoverPos);
  drawHits(hits, false);
  renderPanel(hits, false);
});

/* 左键：锁定 */
img.addEventListener('click', (evt) => {
  const q = toImg(evt);
  if (locked && lockedAt
      && Math.abs(q.x - lockedAt.x) <= RADIUS && Math.abs(q.y - lockedAt.y) <= RADIUS) {
    return;                       // 点在同一处，忽略
  }
  const hits = hitTest(q);
  if (!hits.length) {
    if (!locked) {
      panel.classList.remove('locked');
      panel.innerHTML = '<div class="hint">此处没有数据点，未锁定。</div>';
    }
    return;
  }
  locked = true;
  lockedHits = hits;
  lockedAt = q;
  drawHits(hits, true);
  renderPanel(hits, true);
});

/* 右键：解锁，并屏蔽浏览器菜单 */
img.addEventListener('contextmenu', (evt) => {
  evt.preventDefault();
  if (!locked) return;
  locked = false;
  lockedHits = [];
  lockedAt = null;
  ctx.clearRect(0, 0, 1780, 1000);
  if (hoverPos) {
    const hits = hitTest(hoverPos);
    drawHits(hits, false);
    renderPanel(hits, false);
  } else {
    renderPanel([], false);
  }
});

/* Esc：也可解锁 */
document.addEventListener('keydown', (evt) => {
  if (evt.key !== 'Escape' || !locked) return;
  locked = false;
  lockedHits = [];
  lockedAt = null;
  ctx.clearRect(0, 0, 1780, 1000);
  renderPanel([], false);
});

/* 移出：未锁定时清空；锁定时保持 */
img.addEventListener('mouseleave', () => {
  hoverPos = null;
  if (locked) return;
  ctx.clearRect(0, 0, 1780, 1000);
  renderPanel([], false);
});
</script>
